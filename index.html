<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Daily +2% Picks</title>
<style>
:root { --bg:#f7f7f5; --fg:#1b1b1b; --muted:#666; --card:#fff; --line:#e3e3df;
  --hit:#127a3a; --hitbg:#e2f4e8; --miss:#a32020; --missbg:#fbe5e5; --wait:#6b5d00; --waitbg:#fbf3cf; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#141414; --fg:#ececec; --muted:#9a9a9a; --card:#1e1e1e; --line:#333;
    --hit:#7ee0a0; --hitbg:#173323; --miss:#ff9c9c; --missbg:#3a1a1a; --wait:#f1dc72; --waitbg:#36300f; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
main { max-width:960px; margin:0 auto; padding:24px 16px 48px; }
h1 { font-size:1.6rem; margin:0 0 4px; } h2 { font-size:1.15rem; margin:32px 0 8px; }
h3 { margin:0 0 6px; font-size:1rem; color:var(--muted); font-weight:600; }
.muted { color:var(--muted); font-size:.88rem; margin:4px 0; }
.warn { color:var(--miss); font-size:.88rem; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
.ticker { font-size:2rem; font-weight:700; letter-spacing:.02em; }
.card p { margin:6px 0; }
.badge { display:inline-block; padding:1px 8px; border-radius:999px; font-size:.8rem; font-weight:700; }
.hit { color:var(--hit); background:var(--hitbg); } .miss { color:var(--miss); background:var(--missbg); }
.wait { color:var(--wait); background:var(--waitbg); } .none { color:var(--muted); }
.scroll { overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-size:.9rem; }
th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
th { color:var(--muted); font-weight:600; }
.num { text-align:right; font-variant-numeric:tabular-nums; }
details summary { cursor:pointer; color:var(--muted); font-size:.88rem; margin-top:6px; }
a { color:inherit; }
footer { margin-top:40px; color:var(--muted); font-size:.82rem; }

[hidden] { display:none !important; }
#gate { min-height:100vh; display:grid; place-items:center; padding:16px; }
#gate form { width:100%; max-width:340px; }
#gate h1 { font-size:1.2rem; }
#pw { width:100%; font:inherit; padding:10px 12px; margin:10px 0 6px; border:1px solid var(--line);
  border-radius:8px; background:var(--bg); color:var(--fg); }
#go { width:100%; font:inherit; font-weight:600; padding:10px; border:0; border-radius:8px;
  background:var(--fg); color:var(--bg); cursor:pointer; }
#go:disabled { opacity:.6; cursor:wait; }
.check { display:flex; gap:8px; align-items:center; font-size:.88rem; color:var(--muted); margin:4px 0 12px; }
#err { color:var(--miss); font-size:.88rem; min-height:1.3em; margin:8px 0 0; }
#lock { position:fixed; top:10px; right:12px; font:inherit; font-size:.82rem; padding:4px 10px;
  border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--muted); cursor:pointer; }
</style>
</head>
<body>
<div id="gate">
<form class="card" id="form">
<h1>Daily +2% Picks</h1>
<p class="muted">This page is encrypted. Enter the password to view it.</p>
<input type="text" name="username" value="jpd5" autocomplete="username" hidden>
<input type="password" id="pw" autocomplete="current-password" placeholder="Password" required autofocus>
<label class="check"><input type="checkbox" id="remember" checked> Remember on this device</label>
<button type="submit" id="go">Unlock</button>
<p id="err" role="alert"></p>
<noscript><p class="muted">JavaScript is needed to decrypt this page.</p></noscript>
</form>
</div>
<button id="lock" type="button" hidden>Lock</button>
<div id="app"></div>

<script>
(() => {
  const P = JSON.parse(document.getElementById("payload").textContent);
  const STORE = "jpd5-key";
  const $ = (id) => document.getElementById(id);
  const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const b64 = (u) => btoa(String.fromCharCode(...u));
  const saved = () => {
    try { return JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) { return null; }
  };
  const keep = (v) => {
    try { v ? localStorage.setItem(STORE, JSON.stringify(v)) : localStorage.removeItem(STORE); } catch (e) {}
  };
  async function derive(password) {
    const base = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", salt: bytes(P.salt), iterations: P.iterations, hash: "SHA-256" }, base, 256);
    return new Uint8Array(bits);
  }
  async function decrypt(raw) {
    const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, key, bytes(P.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  function show(d) {
    $("app").innerHTML = d.body;
    for (const [id, body, type] of [["dl-json", d.json, "application/json"], ["dl-csv", d.csv, "text/csv"]]) {
      const a = $(id);
      if (a) a.href = URL.createObjectURL(new Blob([body], { type }));
    }
    $("gate").hidden = true;
    $("lock").hidden = false;
  }
  $("lock").onclick = () => { keep(null); location.reload(); };
  $("form").onsubmit = async (e) => {
    e.preventDefault();
    $("err").textContent = "";
    $("go").disabled = true;
    $("go").textContent = "Unlocking...";
    try {
      const raw = await derive($("pw").value);
      const d = await decrypt(raw);
      keep($("remember").checked ? { salt: P.salt, key: b64(raw) } : null);
      show(d);
    } catch (err) {
      $("err").textContent = "Wrong password.";
      $("pw").select();
    } finally {
      $("go").disabled = false;
      $("go").textContent = "Unlock";
    }
  };
  if (!window.crypto || !crypto.subtle) {
    $("err").textContent = "This browser cannot decrypt the page (it needs HTTPS).";
    return;
  }
  const s = saved();
  if (s && s.salt === P.salt) {
    $("gate").hidden = true;
    decrypt(bytes(s.key)).then(show, () => { keep(null); $("gate").hidden = false; });
  }
})();
</script>
