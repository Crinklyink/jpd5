<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0907">
<title>The +2% Pick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
:root { --bg:#0a0907; --panel:#13110d; --panel2:#18150f; --fg:#efe8da; --muted:#968d7c;
  --line:rgba(216,180,106,.16); --gold:#d8b46a; --gold2:#f4e2ab; --silver:#b9bfca;
  --hit:#86c9a2; --hitbg:rgba(134,201,162,.12); --miss:#e3907f; --missbg:rgba(227,144,127,.12);
  --wait:#e8d293; --waitbg:rgba(232,210,147,.10); color-scheme:dark; }
* { box-sizing:border-box; }
html { background:var(--bg); }
body { margin:0; min-height:100vh; color:var(--fg);
  background:radial-gradient(1100px 520px at 50% -180px, rgba(216,180,106,.13), transparent 70%), var(--bg);
  font:15px/1.6 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width:1020px; margin:0 auto; padding:64px 16px 72px; }
h1, h2, .ticker, .stat b { font-family:"Cormorant Garamond", Georgia, serif; font-weight:600; }
h1 { font-size:clamp(2.3rem, 6vw, 3.6rem); line-height:1.04; margin:0 0 14px; letter-spacing:.01em; }
h1 em, h2 em { font-style:italic; font-weight:500; color:var(--gold); }
h2 { font-size:1.85rem; margin:64px 0 18px; display:flex; align-items:center; gap:18px; }
h2::after { content:""; flex:1; height:1px; background:linear-gradient(90deg, var(--line), transparent); }
h3, .eyebrow { margin:0 0 12px; font-size:.7rem; font-weight:500; letter-spacing:.28em;
  text-transform:uppercase; color:var(--gold); }
.lede { color:var(--muted); max-width:660px; margin:0; }
.muted { color:var(--muted); font-size:.85rem; margin:6px 0; }
.warn { color:var(--miss); font-size:.85rem; }
.grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:20px; }
.card { background:linear-gradient(180deg, var(--panel2), var(--panel)); border:1px solid var(--line);
  border-radius:16px; padding:26px; box-shadow:inset 0 1px 0 rgba(255,255,255,.035), 0 24px 48px -28px #000; }
.card p { margin:8px 0; }
.ticker { font-size:3.6rem; line-height:1; letter-spacing:.05em; margin:4px 0 16px; color:var(--gold);
  background:linear-gradient(180deg, var(--gold2), var(--gold) 70%); -webkit-background-clip:text;
  background-clip:text; -webkit-text-fill-color:transparent; }
.silver .ticker { color:var(--silver); background:linear-gradient(180deg, #f1f3f7, var(--silver) 70%);
  -webkit-background-clip:text; background-clip:text; }
.silver h3 { color:var(--silver); }
.badge { display:inline-block; padding:3px 11px; border-radius:999px; font-size:.68rem; font-weight:600;
  letter-spacing:.16em; }
.hit { color:var(--hit); background:var(--hitbg); } .miss { color:var(--miss); background:var(--missbg); }
.wait { color:var(--wait); background:var(--waitbg); } .none { color:var(--muted); }
.scroll { overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-size:.88rem; }
th, td { text-align:left; padding:11px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
th { color:var(--muted); font-weight:500; font-size:.68rem; letter-spacing:.2em; text-transform:uppercase; }
tbody tr:last-child td { border-bottom:0; }
.num { text-align:right; font-variant-numeric:tabular-nums; }
details summary { cursor:pointer; color:var(--gold); font-size:.7rem; letter-spacing:.2em;
  text-transform:uppercase; margin-top:16px; }
a { color:var(--gold); text-decoration:none; border-bottom:1px solid var(--line); }
.stats { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:16px; margin:6px 0 4px; }
.stat b { display:block; font-size:2.5rem; line-height:1.05; color:var(--fg); }
.stat span { color:var(--muted); font-size:.8rem; }
.legend { display:flex; flex-wrap:wrap; gap:20px; margin:0 0 10px; font-size:.8rem; color:var(--muted); }
.legend i { display:inline-block; width:22px; height:2px; margin-right:8px; vertical-align:middle; }
.legend .goal { background:repeating-linear-gradient(90deg, var(--gold) 0 4px, transparent 4px 8px); opacity:.6; }
svg.chart { display:block; width:100%; height:auto; }
.narrow { display:none; }
@media (max-width:620px) { .wide { display:none; } .narrow { display:block; }
  .card { padding:20px 18px; } .ticker { font-size:3rem; } main { padding-top:48px; }
  .stat b { font-size:1.75rem; } .stat span { font-size:.72rem; } }
svg.chart text { fill:var(--muted); font:11px Inter, system-ui, sans-serif; }
footer { margin-top:72px; padding-top:24px; border-top:1px solid var(--line); color:var(--muted);
  font-size:.78rem; text-align:center; letter-spacing:.03em; }

[hidden] { display:none !important; }
#gate { min-height:100vh; display:grid; place-items:center; padding:16px; }
#gate form { width:100%; max-width:380px; text-align:center; padding:44px 34px 34px; }
.crest { width:54px; height:54px; margin:0 auto 22px; border-radius:50%; display:grid; place-items:center;
  border:1px solid var(--line); color:var(--gold); font:500 1.6rem "Cormorant Garamond", Georgia, serif;
  background:radial-gradient(circle at 50% 30%, rgba(216,180,106,.18), transparent 70%); }
#gate h1 { font-size:2.2rem; margin:0 0 6px; }
#pw { width:100%; font:inherit; font-size:1rem; text-align:center; letter-spacing:.06em; padding:12px 4px;
  margin:26px 0 14px; color:var(--fg); background:transparent; border:0; border-bottom:1px solid var(--line);
  border-radius:0; outline:none; transition:border-color .2s; }
#pw:focus { border-bottom-color:var(--gold); }
#pw::placeholder { color:var(--muted); font-style:italic; letter-spacing:.02em; }
#go { width:100%; font:inherit; font-weight:600; font-size:.78rem; letter-spacing:.26em; text-transform:uppercase;
  padding:14px; border:0; border-radius:999px; color:#1a140a; cursor:pointer;
  background:linear-gradient(180deg, var(--gold2), var(--gold)); box-shadow:0 10px 30px -12px rgba(216,180,106,.6); }
#go:disabled { opacity:.6; cursor:wait; }
.check { display:flex; gap:8px; justify-content:center; align-items:center; font-size:.8rem;
  color:var(--muted); margin:0 0 20px; }
.check input { accent-color:var(--gold); }
#err { color:var(--miss); font-size:.85rem; min-height:1.3em; margin:14px 0 0; }
#lock { position:fixed; top:14px; right:16px; z-index:2; font:inherit; font-size:.66rem; letter-spacing:.22em;
  text-transform:uppercase; padding:7px 14px; border:1px solid var(--line); border-radius:999px;
  background:rgba(10,9,7,.7); color:var(--gold); cursor:pointer; backdrop-filter:blur(6px); }
</style>
</head>
<body>
<div id="gate">
<form class="card" id="form">
<div class="crest" aria-hidden="true">&#10022;</div>
<p class="eyebrow">Private</p>
<h1>The +2% Pick</h1>
<p class="muted">Enter the passphrase to continue.</p>
<input type="text" name="username" value="jpd5" autocomplete="username" hidden>
<input type="password" id="pw" autocomplete="current-password" placeholder="your passphrase" required autofocus>
<label class="check"><input type="checkbox" id="remember" checked> Remember this device</label>
<button type="submit" id="go">Enter</button>
<p id="err" role="alert"></p>
<noscript><p class="muted">JavaScript is needed to open this page.</p></noscript>
</form>
</div>
<button id="lock" type="button" hidden>Lock</button>
<div id="app"></div>

<script>
(() => {
  const P = JSON.parse(document.getElementById("payload").textContent);
  const STORE = "jpd5-key";
  const $ = (id) => document.getElementById(id);
  const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const b64 = (u) => btoa(String.fromCharCode(...u));
  const saved = () => {
    try { return JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) { return null; }
  };
  const keep = (v) => {
    try { v ? localStorage.setItem(STORE, JSON.stringify(v)) : localStorage.removeItem(STORE); } catch (e) {}
  };
  async function derive(password) {
    const base = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", salt: bytes(P.salt), iterations: P.iterations, hash: "SHA-256" }, base, 256);
    return new Uint8Array(bits);
  }
  async function decrypt(raw) {
    const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, key, bytes(P.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }

    $("app").innerHTML = d.body;
    for (const [id, body, type] of [["dl-json", d.json, "application/json"], ["dl-csv", d.csv, "text/csv"]]) {
      const a = $(id);
      if (a) a.href = URL.createObjectURL(new Blob([body], { type }));
    }
    $("gate").hidden = true;
    $("lock").hidden = false;
  }

    $("go").textContent = "Opening";

      const raw = await derive($("pw").value);
      const d = await decrypt(raw);
      keep($("remember").checked ? { salt: P.salt, key: b64(raw) } : null);
      show(d);

      $("pw").select();
    } finally {
      $("go").disabled = false;
      $("go").textContent = "Enter";
    }
  };
  if (!window.crypto || !crypto.subtle) {
    $("err").textContent = "This browser cannot open the page (it needs HTTPS).";
    return;
  }
  const s = saved();
  if (s && s.salt === P.salt) {
    $("gate").hidden = true;
    decrypt(bytes(s.key)).then(show, () => { keep(null); $("gate").hidden = false; });
  }
})();
</script>
