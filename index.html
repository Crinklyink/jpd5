<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The +2% Pick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<style>
:root { --paper:#f4f1e9; --ink:#1a1815; --muted:#6f695e; --rule:#d9d2c3;
  --hit:#2d5a42; --miss:#8c2f2a; --wait:#76683f; --line-1am:#a39c90; color-scheme:light; }
@media (prefers-color-scheme: dark) {
  :root { --paper:#141311; --ink:#ebe6dc; --muted:#958e81; --rule:#35312b;
    --hit:#94c3a4; --miss:#de9186; --wait:#cbb98a; --line-1am:#7a7469; color-scheme:dark; }
}
* { box-sizing:border-box; }
html, body { background:var(--paper); }
body { margin:0; color:var(--ink); font:17px/1.55 Newsreader, "Iowan Old Style", Georgia, serif;
  font-optical-sizing:auto; font-variant-numeric:lining-nums tabular-nums; -webkit-font-smoothing:antialiased; }
main { max-width:940px; margin:0 auto; padding:28px 20px 40px; }
.mast { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:4px 20px;
  border-bottom:2px solid var(--ink); padding-bottom:8px; }
.mast h1 { margin:0; font-size:1.55rem; font-weight:600; letter-spacing:-.01em; }
.mast p { margin:0; color:var(--muted); font-size:.9rem; }
.standfirst { margin:12px 0 0; color:var(--muted); max-width:640px; }
section { margin-top:42px; }
h2 { margin:0; padding-bottom:6px; border-bottom:1px solid var(--rule); font-size:1.05rem; font-weight:600; }
.picks { display:grid; grid-template-columns:1fr 1fr; border-bottom:1px solid var(--rule); }
.pick { padding:16px 24px 20px 0; }
.pick + .pick { padding:16px 0 20px 24px; border-left:1px solid var(--rule); }
.pick p { margin:3px 0; }
.label { margin:0; color:var(--muted); font-size:.92rem; }
.ticker { margin:6px 0 10px; font-size:clamp(2.8rem, 9vw, 4.5rem); font-weight:500; line-height:1;
  letter-spacing:-.02em; }
.small { color:var(--muted); font-size:.88rem; }
.hit { color:var(--hit); } .miss { color:var(--miss); } .wait { color:var(--wait); font-style:italic; }
.scroll { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:.95rem; }
th, td { padding:8px 0; border-bottom:1px solid var(--rule); text-align:left; white-space:nowrap;
  vertical-align:baseline; }
th { color:var(--muted); font-weight:400; font-size:.85rem; }
th + th, td + td, th + td { padding-left:14px; }
.record { max-width:620px; }
.record tbody th { color:var(--ink); font-size:.95rem; font-weight:400; }
.record tr.lead td, .record tr.lead th { border-bottom:0; padding-bottom:2px; }
.record tr:not(.lead) td, .record tr:not(.lead) th { padding-top:2px; }
@media (max-width:640px) { .record { font-size:.9rem; } th + th, td + td, th + td { padding-left:8px; } }
.num { text-align:right; }
tbody tr:last-child td, tbody tr:last-child th { border-bottom:0; }
details { margin-top:10px; }
summary { cursor:pointer; color:var(--muted); font-size:.88rem; }
details table { max-width:300px; font-size:.88rem; }
.note { margin:10px 0 0; max-width:680px; color:var(--muted); font-size:.88rem; }
.chart-title { margin:20px 0 0; font-size:.95rem; }
svg.chart { display:block; width:100%; height:auto; margin-top:6px; overflow:visible; }
svg.chart text { fill:var(--muted); font:13px Newsreader, Georgia, serif; }
svg.chart text.tag { fill:var(--ink); }
.narrow { display:none; }
a { color:inherit; text-decoration-thickness:1px; text-underline-offset:3px; }
footer { margin-top:56px; padding-top:10px; border-top:1px solid var(--rule); color:var(--muted);
  font-size:.82rem; }
@media (max-width:640px) {
  body { font-size:16px; }
  .picks { grid-template-columns:1fr; }
  .pick, .pick + .pick { padding:14px 0 18px; border-left:0; }
  .pick + .pick { border-top:1px solid var(--rule); }
  .wide { display:none; } .narrow { display:block; }
}

[hidden] { display:none !important; }
#gate { max-width:360px; margin:16vh auto 0; padding:0 20px; }
#gate h1 { margin:0 0 30px; padding-bottom:8px; border-bottom:2px solid var(--ink); font-size:1.55rem;
  font-weight:600; letter-spacing:-.01em; }
#pw { display:block; width:100%; margin:4px 0 0; padding:6px 0; font:inherit; font-size:1.15rem;
  color:var(--ink); background:transparent; border:0; border-bottom:1px solid var(--ink); border-radius:0;
  outline:none; }
.row { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:18px; }
.row label { color:var(--muted); font-size:.88rem; }
.row input { accent-color:var(--ink); }
#go { font:inherit; font-size:.95rem; padding:7px 18px; color:var(--paper); background:var(--ink); border:0;
  border-radius:2px; cursor:pointer; }
#go:disabled { opacity:.6; cursor:wait; }
#err { min-height:1.4em; margin:14px 0 0; color:var(--miss); font-size:.9rem; }
.lockline { max-width:940px; margin:0 auto; padding:0 20px 40px; }
#lock { font:inherit; font-size:.82rem; color:var(--muted); background:none; border:0; padding:0;
  text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
</style>
</head>
<body>
<div id="gate">
<form id="form">
<h1>The +2% Pick</h1>
<label class="label" for="pw">Passphrase</label>
<input type="text" name="username" value="jpd5" autocomplete="username" hidden>
<input type="password" id="pw" autocomplete="current-password" required autofocus>
<div class="row">
<label><input type="checkbox" id="remember" checked> Remember this device</label>
<button type="submit" id="go">Open</button>
</div>
<p id="err" role="alert"></p>
<noscript><p class="small">JavaScript is needed to open this page.</p></noscript>
</form>
</div>
<div id="app"></div>
<p class="lockline" id="lockline" hidden><button id="lock" type="button">Lock this device</button></p>

<script>
(() => {
  const P = JSON.parse(document.getElementById("payload").textContent);
  const STORE = "jpd5-key";
  const $ = (id) => document.getElementById(id);
  const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const b64 = (u) => btoa(String.fromCharCode(...u));
  const saved = () => {
    try { return JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) { return null; }
  };
  const keep = (v) => {
    try { v ? localStorage.setItem(STORE, JSON.stringify(v)) : localStorage.removeItem(STORE); } catch (e) {}
  };
  async function derive(password) {
    const base = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", salt: bytes(P.salt), iterations: P.iterations, hash: "SHA-256" }, base, 256);
    return new Uint8Array(bits);
  }
  async function decrypt(raw) {
    const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, key, bytes(P.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  function show(d) {
    $("app").innerHTML = d.body;
    for (const [id, body, type] of [["dl-json", d.json, "application/json"], ["dl-csv", d.csv, "text/csv"]]) {
      const a = $(id);
      if (a) a.href = URL.createObjectURL(new Blob([body], { type }));
    }
    $("gate").hidden = true;
    $("lockline").hidden = false;
  }
  $("lock").onclick = () => { keep(null); location.reload(); };
  $("form").onsubmit = async (e) => {
    e.preventDefault();
    $("err").textContent = "";
    $("go").disabled = true;
    try {
      const raw = await derive($("pw").value);
      const d = await decrypt(raw);
      keep($("remember").checked ? { salt: P.salt, key: b64(raw) } : null);
      show(d);
    } catch (err) {
      $("err").textContent = "That isn't the passphrase.";
      $("pw").select();
    } finally {
      $("go").disabled = false;
    }
  };
  if (!window.crypto || !crypto.subtle) {
    $("err").textContent = "This browser can't open the page (it needs HTTPS).";
    return;
  }
  const s = saved();
  if (s && s.salt === P.salt) {
    $("gate").hidden = true;
    decrypt(bytes(s.key)).then(show, () => { keep(null); $("gate").hidden = false; });
  }
})();
</script>
